# Defaults loaded into the DB the first time the app starts. After that,
# the DB is the source of truth -- edit everything from the UI. This file
# is only a starting point, not a hard limit on anything.
# Missing keys in an existing install are filled additively from this file.

backbone:
  window_size: 200          # bars used to fit the OLS
  chart_history_bars: 500   # bars shown on the residual chart (betas still come from window_size)
  sampling_time: 900        # bar size in seconds; entries are scanned once per bar (15m: a 1-minute residual moves ~0.13% of gross, less than round-trip costs)
  exit_check_sec: 60        # open trades (exits, stops, liquidation guard) are checked this often; 0 = once per bar
  adf_alpha: 0.05           # ADF p-value must be <= this
  kpss_alpha: 0.05          # KPSS p-value must be >= this
  z_entry: 2.5
  z_close: 0.5
  z_stop_loss: 4.5          # also blocks entries at or beyond this |z|
  # Skip entries above this |z| (0 = off): large deviations were more often breaks than stretches.
  z_entry_max: 3.5
  fee_rate: 0.001           # exchange trading fee, fractional
  slippage_rate: 0.0005     # modeled slippage, fractional
  paper_start_balance: 1000 # paper mode (XT groups): starting USDT wallet shared by all groups; entries are sized/refused against it. 0 = no check
  trade_notional: 100       # TOTAL (gross) notional of all legs of one basket; legs split by |beta|
  # Min net profit (as fraction of total leg notional G) required at a perfect
  # close to |z|=z_close, after round-trip costs. 0.01 = 1%. 0 disables the gate.
  target_profit_rate: 0.003
  # Cap how much leg_orders may inflate a basket to clear MIN_ORDER_VALUE_IRT.
  # Large scale is a proxy for thin books (small natural notional). 3.0 rejects
  # the worst historical thin-cap trades while allowing moderate majors (~1.3x).
  # Set to 0 to disable.
  max_entry_scale: 3.0
  # Stationarity test on the OLS residual. "engle_granger" (recommended) uses
  # MacKinnon cointegration critical values; "adf_kpss" is the legacy ADF test on
  # the fitted residual, which is far too lenient (14-45% false passes at 5%).
  # adf_alpha is the p-value threshold for either; KPSS stays as extra filter.
  stationarity_method: engle_granger
  # Seconds to wait before re-trying a group after a failed/rolled-back entry.
  entry_retry_cooldown_sec: 600
  # Hard cap: close a position that has not reverted after this many hours (0 = off).
  max_holding_hours: 48
  # Time stop in half-lives of the entry fit's residual (0 = off): close after this many half-lives.
  max_holding_halflives: 3.0
  # "oos": fit the OLS without the current bar, score the current bar out of sample and scale z by the OLS
  # prediction-error std (recommended). "in_sample": legacy z of the last fitted residual, whose std is too
  # small (stops filled at |z| 8-13). The same scale is frozen into the trade for its exits.
  zscore_method: oos
  # Expected-value gate: win_rate x gain - (1 - win_rate) x loss-at-stop must be > 0 after costs.
  # The win rate is the group's backtest win rate shrunk toward ev_win_rate (ev_win_rate alone in backtests).
  ev_gate: true
  ev_win_rate: 0.65
  # How far past z_stop_loss a stop typically fills (discrete cycles), in z.
  ev_stop_overshoot: 0.5
  # Skip the entry when a residual move in the last jump_bars bars is > jump_max_sigma x its usual one-bar
  # move (one coin hit by news / a listing / funding). 0 = off.
  jump_max_sigma: 4.0
  jump_bars: 2
  # Skip the entry while the residual's last vol_regime_bars bars are > vol_regime_max x as volatile
  # (one-bar moves) as the rest of the fit window. 0 = off.
  vol_regime_max: 2.0
  vol_regime_bars: 20
  # Init/backtest: try every symbol of a group as the dependent one.
  try_all_dependents: true
  # Min seconds between stored OLS-fit rows per group while no entry signal
  # (0 = store every cycle, the old behaviour).
  fit_log_interval_sec: 900
  # Reject groups whose residual AR(1) half-life is > window_size * this
  # fraction (or < 2 bars). 0 disables the filter.
  half_life_max_fraction: 0.25
  # Portfolio caps (0 = off). Entries skipped when exceeded.
  max_total_gross_notional: 0
  max_open_trades: 3
  # Skip entry if any symbol's latest bar is older than this * sampling_time.
  data_staleness_mult: 3.0
  # Force close when mark is within this fraction of liquidation price (0=off).
  # Applies in live, paper and backtests (paper/backtest use the modeled liquidation price).
  # A fresh position starts inside this band when leverage >= 1/(fraction + maintenance_margin_rate)
  # (about 4.9x at 0.20), so such entries are skipped.
  liquidation_proximity_fraction: 0.20
  # Modeled maintenance margin rate used for paper/backtest liquidation prices (isolated margin).
  maintenance_margin_rate: 0.005
  # XT-only: leverage applied once per symbol before first order (default 2).
  xt_leverage: 2
  # XT-only: "isolated" | "cross" (default isolated).
  xt_margin_mode: isolated
  # XT trades whole CONTRACTS (e.g. 1 XRP contract = 10 XRP), so every leg is rounded to an integer
  # number of contracts before an order is sized (paper, backtest and live alike). "joint" searches
  # nearby whole-contract combinations that keep the hedge ratio closest to plan, "nearest" rounds
  # each leg on its own, "floor" truncates, "off" keeps continuous sizes.
  contract_rounding: joint
  # Allowed change of the TOTAL notional versus trade_notional when searching contract combinations.
  contract_max_size_dev: 0.35
  # Skip the entry when any leg's share of the hedge drifts more than this after rounding (0 = off).
  contract_max_drift: 0.15
  # Assumed price move of the unhedged part while a trade is open, used by the noise check below.
  contract_drift_move: 0.01
  # Skip the entry when (unhedged notional x contract_drift_move) exceeds this fraction of the expected
  # net profit of the trade, i.e. when rounding noise could swamp the edge (0 = off).
  contract_noise_ratio_max: 0.5
  # Assumed funding cost per holding interval (fraction). 0.0 = no funding cost
  # so Nobitex behaviour is unchanged. Tune from fetchFundingRateHistory.
  funding_rate_estimate: 0.0
  # Fixed number of funding intervals assumed at entry (simplification; not a
  # half-life forecast). Multiplied by funding_rate_estimate into cost_rate.
  expected_holding_funding_intervals: 1

init:
  method: random            # "random" | "sector"
  min_group_size: 2
  max_group_size: 3         # more legs = more overfitting (paper PnL fell with every extra leg)
  top_n_liquid_symbols: 60
  num_candidate_groups: 500 # only used by "random" method; more tries = more luck in the winners
  max_combos_per_sector: 200  # only used by "sector" method
  keep_top_n: 5
  # Groups are ranked by the t-statistic of their mean in-sample trade PnL (grows with the trade count).
  # Fewer in-sample trades than this = dropped; 1-2 trades say nothing about an edge.
  min_trades: 3
  # Out-of-sample: rank on first 70% of history; keep only if held-out PnL > 0 when true.
  require_oos_positive: true
  backtest_days: 30
  quote_currency: IRT

system:
  # paper/live is controlled by BotState (POST /api/bot/mode), not here --
  # this section only holds exchange connection settings.
  base_url: https://apiv2.nobitex.ir
